[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mwnetwork"
version = "0.1.0"
description = "Cross-study metabolite correlation network, from Metabolomics Workbench data"
requires-python = ">=3.10"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "scipy==1.18.0",
    "requests==2.34.2",
    "mwtab==2.1.1",
    "pyarrow==25.0.1",
    "networkx==3.6.1",
    "plotly==6.9.0",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
    "sspa==1.0.4",
    "gseapy==1.3.1",
    "tqdm==4.70.0",
]

[tool.setuptools.packages.find]
where = ["src"]
